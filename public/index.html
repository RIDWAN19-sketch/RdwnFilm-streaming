<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RdwnFilm - Streaming Film Ala Netflix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Navbar Transparan Dinamis -->
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="#" class="logo" id="logo-link">RdwnFilm</a>
                <nav class="nav-links" id="nav-links">
                    <a href="#" class="active" data-route="home">Beranda</a>
                    <a href="#category/popular" data-category="popular">Populer</a>
                    <a href="#category/now-playing" data-category="now-playing">Sedang Tayang</a>
                    <a href="#category/top-rated" data-category="top-rated">Rating Tinggi</a>
                    <a href="#category/upcoming" data-category="upcoming">Segera Tayang</a>
                    <a href="#mylist" data-route="mylist">Daftar Saya <span id="mylist-badge" class="badge">0</span></a>
                </nav>
            </div>

            <div class="nav-right">
                <!-- Dropdown 1 Kategori Negara Transparan -->
                <div class="transparent-dropdown-wrapper">
                    <select id="country-select" class="glass-select" aria-label="Pilih Negara">
                        <option value="">🌍 Negara</option>
                        <option value="ID">🇮🇩 Indonesia</option>
                        <option value="KR">🇰🇷 Korea Selatan</option>
                        <option value="JP">🇯🇵 Jepang</option>
                        <option value="US">🇺🇸 Amerika Serikat</option>
                        <option value="TH">🇹🇭 Thailand</option>
                        <option value="IN">🇮🇳 India</option>
                        <option value="GB">🇬🇧 Inggris</option>
                        <option value="FR">🇫🇷 Prancis</option>
                        <option value="CN">🇨🇳 Tiongkok</option>
                        <option value="HK">🇭🇰 Hong Kong</option>
                    </select>
                </div>

                <!-- Dropdown Genre Transparan -->
                <div class="transparent-dropdown-wrapper">
                    <select id="genre-select" class="glass-select" aria-label="Pilih Genre">
                        <option value="">🎬 Genre</option>
                        <option value="28">Action</option>
                        <option value="12">Adventure</option>
                        <option value="16">Animation</option>
                        <option value="35">Comedy</option>
                        <option value="80">Crime</option>
                        <option value="99">Documentary</option>
                        <option value="18">Drama</option>
                        <option value="10751">Family</option>
                        <option value="14">Fantasy</option>
                        <option value="36">History</option>
                        <option value="27">Horror</option>
                        <option value="10402">Music</option>
                        <option value="9648">Mystery</option>
                        <option value="10749">Romance</option>
                        <option value="878">Sci-Fi</option>
                        <option value="53">Thriller</option>
                    </select>
                </div>

                <!-- Search Box Transparan -->
                <div class="search-bar glass-search">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Judul film...">
                    <button id="search-btn" title="Cari">Cari</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <!-- View 1: Netflix Home (Hero Billboard + Horizontal Sliders) -->
        <section id="netflix-home-view" class="view">
            <div id="hero-billboard" class="hero-billboard"></div>
            <div id="netflix-rows-container" class="netflix-rows-container"></div>
        </section>

        <!-- View 2: Grid View (Untuk Kategori, Negara, Genre, Pencarian, Daftar Saya) -->
        <section id="grid-view" class="view container" style="display: none;">
            <div class="grid-header-bar">
                <h2 id="section-title">Daftar Film</h2>
                <div id="country-pills" class="country-pills" style="display: none;"></div>
            </div>
            <div id="movie-grid" class="movie-grid"></div>
        </section>

        <!-- View 3: Detail Film -->
        <section id="detail-view" class="view" style="display: none;"></section>

        <!-- View 4: Player Video -->
        <section id="player-view" class="view container" style="display: none;"></section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <footer class="footer">
        <p>© 2026 <strong>RdwnFilm</strong> — Tampilan & Fitur Streaming Modern. Data film didukung oleh TMDB.</p>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
